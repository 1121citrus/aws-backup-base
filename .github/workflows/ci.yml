name: CI

on:
  push:
    branches: [dev, main, staging]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  # contents: write is not for this repo's own use -- it satisfies
  # shared-github-workflows pipeline.yml@v1's optional "promote" job,
  # which declares permissions: contents: write internally. A reusable
  # workflow's caller must grant at least as much as the most permissive
  # job it contains, or GitHub rejects the whole workflow at validation
  # time (startup_failure, zero jobs created) -- even though this repo
  # never sets auto-promote and that job would never run.
  contents: write

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/aws-backup-base
      inject-metadata: true
      test-mode: bats-docker-cli
      test-bats-files: |
        test/01-build.bats
        test/02-image-contents.bats
      smoke-enabled: true
      smoke-commands: |
        docker run --rm "${full_image}:${VERSION}" aws --version
        docker run --rm "${full_image}:${VERSION}" supercronic --version
        docker run --rm "${full_image}:${VERSION}" bash -c 'bash --version | head -1'
        docker run --rm "${full_image}:${VERSION}" test -x /usr/local/bin/healthcheck-base
        docker run --rm "${full_image}:${VERSION}" test -x /usr/local/bin/startup-base
        docker run --rm "${full_image}:${VERSION}" test -r /usr/local/include/common-functions
      trivyignore: .trivyignore
    secrets: inherit
