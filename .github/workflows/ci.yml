name: CI

on:
  push:
    branches: [main, staging]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/aws-backup-base
      inject-metadata: true
      test-mode: bats-docker-cli
      test-bats-files: |
        test/01-build.bats
        test/02-image-contents.bats
      smoke-enabled: true
      smoke-commands: |
        docker run --rm "${full_image}:${VERSION}" aws --version
        docker run --rm "${full_image}:${VERSION}" supercronic --version
        docker run --rm "${full_image}:${VERSION}" bash -c 'bash --version | head -1'
        docker run --rm "${full_image}:${VERSION}" test -x /usr/local/bin/healthcheck-base
        docker run --rm "${full_image}:${VERSION}" test -x /usr/local/bin/startup-base
        docker run --rm "${full_image}:${VERSION}" test -r /usr/local/include/common-functions
      trivyignore: .trivyignore
    secrets: inherit
